services:
  trust:
    build: .
    env_file: .env
    environment:
      TRUST_DB: /srv/data/trust.db
      TRUST_ENV: local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - trust_data:/srv/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  trust_data:
