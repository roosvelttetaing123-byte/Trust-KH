name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: trust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-cjk
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app scripts
      - run: node --check app/static/app.js && node --check app/static/citizen-i18n.js && node --check app/static/i18n.js && node --check app/static/sw.js && node --check app/static/project/studio.js
