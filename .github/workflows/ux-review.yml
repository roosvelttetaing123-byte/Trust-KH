name: Citizen UX checks
on:
  push:
    branches: [ux/simple-check-and-pdf]
  pull_request:
permissions:
  contents: read
concurrency:
  group: citizen-ux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-and-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install PDF native dependencies
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-cjk
      - run: python -m pip install -r requirements-dev.txt playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - name: Real HTTP citizen flow and PDF download
        run: python scripts/citizen_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citizen-ux-review
          path: artifacts/citizen/
          retention-days: 7
          if-no-files-found: warn
